version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyaho_app
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-kyaho}
      - DB_PORT=${DB_PORT:-5432}
      - APP_PORT=${APP_PORT:-3000}
    networks:
      - traefik-public

    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}

      - traefik.http.routers.kyaho-space-api.rule=Host(`${DOMAIN:-example.com}`)
      - traefik.http.routers.kyaho-space-api.entrypoints=websecure
      - traefik.http.routers.kyaho-space-api.tls=true
      - traefik.http.routers.kyaho-space-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.kyaho-space-api.service=kyaho-space-api
      - traefik.http.services.kyaho-space-api.loadbalancer.server.port=${APP_PORT:-3000}

networks:
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}
